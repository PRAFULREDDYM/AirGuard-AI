version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: airguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airguard
      POSTGRES_PASSWORD: airguard_secure_password
      POSTGRES_DB: airguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: airguard_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://airguard:airguard_secure_password@db:5432/airguard
      SECRET_KEY: airguard-prod-secret-key-change-in-env
      AIRGUARD_ENCRYPTION_KEY: airguard-aes256-default-key-32b!
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: airguard_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://api:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - api

  mqtt_broker:
    image: eclipse-mosquitto:2.0
    container_name: airguard_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  postgres_data:

